name: Build iOS IPA

on:
  push:
    branches: [ "master", "main" ]
    # Only rebuild the iOS app when mobile code (or this workflow) changes,
    # so API/docs-only pushes don't burn CI minutes. workflow_dispatch below
    # still lets you trigger a build manually any time.
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build_ios.yml"
  workflow_dispatch:

# The build only reads the repository; uploading artifacts needs no token scope.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          cd apps/mobile
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=https://postdee-api.onrender.com \
            --dart-define=ENABLE_FIREBASE_AUTH=true \
            --dart-define=ALLOW_LOCAL_MOCK_AUTH=false \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=121898224944-1hkh1mrfb5lc1ltraapu10lj1ib465vj.apps.googleusercontent.com

      - name: Create IPA payload
        run: |
          cd apps/mobile
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r PostDee_iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PostDee_iOS
          path: apps/mobile/PostDee_iOS.ipa
