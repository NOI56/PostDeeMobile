# Dedicated staging Blueprint; infrastructure reconciled with Render on 2026-10-20.
#
# Review rules before syncing this Blueprint in Render:
# - Use the staging-only database declared below; never point DATABASE_URL at
#   postdee-postgres or any external production database.
# - Supply a dedicated R2 bucket, Firebase project, and RevenueCat test webhook
#   token for every `sync: false` entry.
# - Keep account deletion and push delivery disabled until their staging-only
#   Firebase service account has been installed and tested.
# - Review the environment-variable diff separately: the provider defaults below
#   have not been verified against live Dashboard values. Do not blindly sync.

services:
  - type: web
    name: postdee-api-staging
    runtime: node
    rootDir: apps/api
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    # Prisma CLI and native build packages must remain available through the
    # migration. Remove dev and unused optional modules before serving traffic.
    startCommand: npm run prisma:migrate:deploy && npm prune --omit=dev --omit=optional && npm run start
    healthCheckPath: /health
    envVars:
      # Keep production guards enabled so staging exercises the same safety
      # checks as the real service.
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postdee-postgres-staging
          property: connectionString
      - key: TEMPLATE_STORE
        value: prisma
      - key: POST_STORE
        value: prisma
      - key: SUBSCRIPTION_STORE
        value: prisma
      - key: ANALYTICS_STORE
        value: prisma
      - key: CAPTION_USAGE_STORE
        value: prisma
      - key: AI_EDIT_USAGE_STORE
        value: prisma
      - key: PUBLISH_QUEUE
        value: memory
      - key: VIDEO_STORAGE
        value: r2
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_UPLOAD_EXPIRES_SECONDS
        value: "300"
      - key: UPLOAD_PROTOCOL_MODE
        value: dual
      - key: MULTIPART_UPLOAD_PART_SIZE_BYTES
        value: "16777216"
      - key: MULTIPART_UPLOAD_SESSION_EXPIRES_SECONDS
        value: "3600"
      - key: CAPTION_PROVIDER
        value: gemini
      - key: GEMINI_CAPTION_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        value: elevenlabs
      - key: EDIT_PLAN_PROVIDER
        value: gemini
      - key: GEMINI_EDIT_PLAN_MODEL
        value: gemini-3.5-flash-lite
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_TRANSCRIPTION_MODEL
        value: scribe_v2
      - key: ELEVENLABS_TRANSCRIPTION_KEYTERMS
        value: ""
      - key: SOCIAL_PUBLISHER
        value: disabled
      # When PostPeer is enabled for a controlled run, refuse to start unless
      # the global Prisma QUEUED/PUBLISHING backlog is completely empty.
      - key: SOCIAL_PUBLISH_REQUIRE_EMPTY_BACKLOG
        value: "true"
      - key: AUTH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DELETE_ENABLED
        value: "false"
      - key: PUSH_SENDER
        value: mock
      - key: BILLING_PROVIDER
        value: revenuecat
      - key: REVENUECAT_WEBHOOK_AUTH_TOKEN
        sync: false
      - key: REVENUECAT_REST_API_V1_KEY
        sync: false
      - key: REVENUECAT_SUBSCRIPTION_ENVIRONMENT
        value: SANDBOX
      - key: REVENUECAT_STARTER_ENTITLEMENT_ID
        value: starter
      - key: REVENUECAT_PRO_ENTITLEMENT_ID
        value: pro
      - key: REVENUECAT_STARTER_PRODUCT_ID
        value: postdee_starter_monthly
      - key: REVENUECAT_PRO_PRODUCT_ID
        value: postdee_pro_monthly

databases:
  - name: postdee-postgres-staging
    region: singapore
    # Blueprint uses a hyphen; the Render API reports this as basic_256mb.
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
    databaseName: postdee_staging
    user: postdee_staging
    ipAllowList: []
